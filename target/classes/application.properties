# ============================================
# CLOUDFLARE AI (Workers AI)
# ============================================
cloudflare.account-id=YOUR_CLOUDFLARE_ACCOUNT_ID
cloudflare.api-token=YOUR_CLOUDFLARE_API_TOKEN
cloudflare.ai-model=@cf/meta/llama-2-7b-chat-int8

# ============================================
# PGVECTOR (PostgreSQL Vector)
# ============================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# SENTRY MONITORING
# ============================================
sentry.dsn=https://xxxxx@xxxxx.ingest.sentry.io/xxxxx
sentry.traces-sample-rate=1.0
sentry.environment=development

# ============================================
# FRONTEND URL
# ============================================
app.frontend.url=http://localhost:3000

# ============================================
# LOGGING
# ============================================
logging.level.com.wondlo=DEBUG