# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=5000
server.error.include-message=always

# ============================================
# DATABASE CONFIGURATION (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/wondlo
spring.datasource.username=postgres
spring.datasource.password=Itumeleng@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# FIREBASE AUTHENTICATION
# ============================================
firebase.service-account-path=firebase-service-account.json

# ============================================
# AMAZON S3 STORAGE
# ============================================
aws.s3.bucket-name=wondlo-tours
aws.s3.region=us-east-1
aws.s3.access-key=YOUR_AWS_ACCESS_KEY
aws.s3.secret-key=YOUR_AWS_SECRET_KEY

